upstream movie_api {
    zone movie_api 64k;
    # Refresh Docker DNS after the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:18000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A proxy_pass without a URI preserves /api and the query string.
    location ~ ^/api(?:/|$) {
        proxy_pass http://movie_api;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /assets { return 404; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /static { return 404; }
    location /static/ { return 404; }
    location ~ \.[^/]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
