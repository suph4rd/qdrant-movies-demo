name: qdrant-movies-demo
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    container_name: qdrant-movies
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - movies-storage:/qdrant/storage
  loader:
    image: qdrant-movies-demo-app:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: "no"
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    depends_on:
      qdrant:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - python docker/wait_for_qdrant.py && exec python -m engine.load --url "$$QDRANT_URL"
  web:
    image: qdrant-movies-demo-app:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    depends_on:
      loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  movies-storage:
