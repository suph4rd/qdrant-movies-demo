{% if user %}
<div class="movie-marks" aria-label="{{ _('My account') }}">
  {% for flag, label in (('watched', 'Watched'), ('liked', 'Liked'), ('watchlist', 'Watchlist')) %}
  {% set selected = mark and mark[flag] if mark is defined else false %}
  <form action="{{ url_for('account_mark') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="lang" value="{{ lang }}">
    <input type="hidden" name="return_url" value="{{ return_url }}">
    <input type="hidden" name="movie_id" value="{{ movie.id }}">
    <input type="hidden" name="reference" value="{{ movie.mark_reference | default('') }}">
    <input type="hidden" name="flag" value="{{ flag }}">
    <input type="hidden" name="state" value="{{ 'false' if selected else 'true' }}">
    <button type="submit" aria-pressed="{{ 'true' if selected else 'false' }}">{{ _('Remove from %(list)s' if selected else 'Add to %(list)s', list=_(label)) }}</button>
  </form>
  {% endfor %}
</div>
{% endif %}
