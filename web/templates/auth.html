{% extends 'base.html' %}
{% block title %}{{ _(heading) }}{% endblock %}
{% block content %}
<h1>{{ _(heading) }}</h1>
{% if error %}<p class="error" role="alert">{{ _(error) }}</p>{% endif %}
<form class="account-form" method="post" action="{{ url_for('register' if registration else 'login') }}?lang={{ lang }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="email">{{ _('Email') }}</label>
  <input id="email" name="email" type="email" autocomplete="email" maxlength="254" value="{{ email }}" required>
  <label for="password">{{ _('Password') }}</label>
  <input id="password" name="password" type="password" autocomplete="{{ 'new-password' if registration else 'current-password' }}"{% if registration %} minlength="12" aria-describedby="password-hint"{% endif %} maxlength="128" required>
  {% if registration %}
  <p id="password-hint" class="muted">{{ _('Use 12–128 characters.') }}</p>
  <label for="password_repeat">{{ _('Repeat password') }}</label>
  <input id="password_repeat" name="password_repeat" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
  {% endif %}
  <button type="submit">{{ _(heading) }}</button>
</form>
{% endblock %}
